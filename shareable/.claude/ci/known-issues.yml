# Known CI Issues Registry
#
# Purpose: track recurring CI failure patterns so agents proactively avoid them.
# Agents MUST check this file before pushing code that touches CI-related areas.
# The CI preflight script (.claude/scripts/ci-preflight.sh) also reads this file.
#
# Format:
#   - id: unique identifier
#     status: active | resolved | workaround
#     category: action-reference | lockfile | build | test | security-scan
#     summary: one-line description
#     pattern: regex or string that appears in CI failure logs
#     root_cause: explanation
#     fix: what to do
#     affected_workflows: list of workflow files
#     first_seen: ISO date
#     resolved_date: ISO date (if resolved)

issues:
  - id: KI-001
    status: active
    category: lockfile
    summary: "pnpm install --frozen-lockfile fails after a dependency is added by hand"
    pattern: "ERR_PNPM_OUTDATED_LOCKFILE"
    root_cause: "package.json was edited without regenerating pnpm-lock.yaml, so CI's frozen install rejects the tree."
    fix: "Run `pnpm install` locally and commit the updated pnpm-lock.yaml in the same commit as the package.json change."
    affected_workflows:
      - .github/workflows/taskflow-ci.yml
    first_seen: "2026-01-15"

# Add an entry the first time a failure repeats. An issue recorded here is one
# the next agent will not spend an hour rediscovering.
